unit:
  id: 0x1A
  label: "CAMERA"

# ------------------------------------------------------------
# Calc convention (same as camera_status.yaml):
#   <name>_raw : unsigned integer D exactly as sent, unit "-"
#   <name>     : derived physical value, `calc_from: <name>_raw`,
#                `calc:` must be a key of CALC_FUNCS in ebox_calcs.py
# Formulas (source: parsing-formulas-slow.docx unless noted):
#   V_5V_SCALE           V   = D / 4095 * 5
#   TDI_FRAME_PERIOD_NS  ns  = D * 100
#   CMOS_EXPOSURE_US     us  = 20 + D * 2
#   TEMP_SETPOINT        degC = (D & 0x3F) / 2      [Table 49 W131: bits5-0, /2]
#   GRATING_POSITION_NM  nm  = D * 20               [Table 49 W155-W157]
# Fields documented as "Directly displayed" / plain concatenation
# (window positions, window rows, version numbers, packet counts)
# stay raw: no calc.
# ------------------------------------------------------------

cards:
  CAMERA_SLOW_STATUS:
    label: "Slow Change Camera Status"
    unit_id: 0x1A
    unit_sub_id: 0x10
    service: 0x66
    subservice: 0x01
    subsystem: CAMERA
    hw_class: SW

    fields:
      # W1 - Product identifier
      - { name: product_identifier, offset: 0, length: 1, type: u8, unit: "-" }

      # W2 - Payload status (bitfield)
      - { name: payload_status, offset: 1, length: 1, type: u8, unit: "-" }
      #   Bit0: main control unit primary/backup flag (0=Primary, 1=Backup)
      #   Bit2-1: operating status (01=Standby, 10=Normal push-broom, 00=Min power, 11=Debug)
      #   Bit3: uplink state (0=off, 1=on)
      #   Bit4: uplink communication channel (0=Primary, 1=Backup)
      #   Bit5: focusing module power (0=off, 1=on)
      #   Bit6: AI module power (0=off, 1=on)
      #   Bit7: unused (0)

      # W3 - RS422 communication reset counter
      - { name: rs422_comm_reset_counter, offset: 2, length: 1, type: u8, unit: "-" }

      # W4-W5 - Main control unit primary voltage (u16, D/4095*5 V)
      - { name: main_ctrl_primary_voltage_raw, offset: 3, length: 2, type: u16, unit: "-" }
      - { name: main_ctrl_primary_voltage, offset: 3, length: 2, type: u16, unit: "V", calc_from: main_ctrl_primary_voltage_raw, calc: "V_5V_SCALE" }

      # W6-W7 - Main control unit primary reference current voltage
      - { name: main_ctrl_primary_ref_current_voltage_raw, offset: 5, length: 2, type: u16, unit: "-" }
      - { name: main_ctrl_primary_ref_current_voltage, offset: 5, length: 2, type: u16, unit: "V", calc_from: main_ctrl_primary_ref_current_voltage_raw, calc: "V_5V_SCALE" }

      # W8-W9 - Main control unit backup voltage
      - { name: main_ctrl_backup_voltage_raw, offset: 7, length: 2, type: u16, unit: "-" }
      - { name: main_ctrl_backup_voltage, offset: 7, length: 2, type: u16, unit: "V", calc_from: main_ctrl_backup_voltage_raw, calc: "V_5V_SCALE" }

      # W10-W11 - Main control unit backup reference current voltage
      - { name: main_ctrl_backup_ref_current_voltage_raw, offset: 9, length: 2, type: u16, unit: "-" }
      - { name: main_ctrl_backup_ref_current_voltage, offset: 9, length: 2, type: u16, unit: "V", calc_from: main_ctrl_backup_ref_current_voltage_raw, calc: "V_5V_SCALE" }

      # W12-W13 - Imaging module primary voltage
      - { name: imaging_primary_voltage_raw, offset: 11, length: 2, type: u16, unit: "-" }
      - { name: imaging_primary_voltage, offset: 11, length: 2, type: u16, unit: "V", calc_from: imaging_primary_voltage_raw, calc: "V_5V_SCALE" }

      # W14-W15 - Imaging module backup voltage
      - { name: imaging_backup_voltage_raw, offset: 13, length: 2, type: u16, unit: "-" }
      - { name: imaging_backup_voltage, offset: 13, length: 2, type: u16, unit: "V", calc_from: imaging_backup_voltage_raw, calc: "V_5V_SCALE" }

      # W16-W17 - Imaging module reference current voltage
      - { name: imaging_ref_current_voltage_raw, offset: 15, length: 2, type: u16, unit: "-" }
      - { name: imaging_ref_current_voltage, offset: 15, length: 2, type: u16, unit: "V", calc_from: imaging_ref_current_voltage_raw, calc: "V_5V_SCALE" }

      # W18-W19 - AI module voltage
      - { name: ai_module_voltage_raw, offset: 17, length: 2, type: u16, unit: "-" }
      - { name: ai_module_voltage, offset: 17, length: 2, type: u16, unit: "V", calc_from: ai_module_voltage_raw, calc: "V_5V_SCALE" }

      # W20-W21 - AI module reference current voltage
      - { name: ai_ref_current_voltage_raw, offset: 19, length: 2, type: u16, unit: "-" }
      - { name: ai_ref_current_voltage, offset: 19, length: 2, type: u16, unit: "V", calc_from: ai_ref_current_voltage_raw, calc: "V_5V_SCALE" }

      # W22 - ARM version number
      - { name: arm_version, offset: 21, length: 1, type: u8, unit: "-" }

      # W23 - Number of ARM program starts
      - { name: arm_program_start_count, offset: 22, length: 1, type: u8, unit: "-" }

      # W24 - Image motion coefficient version number
      - { name: image_motion_coeff_version, offset: 23, length: 1, type: u8, unit: "-" }

      # W25 - FPGA version number
      - { name: fpga_version, offset: 24, length: 1, type: u8, unit: "-" }

      # W26 - RS422 channel uplink state
      - { name: rs422_channel_uplink_state, offset: 25, length: 1, type: u8, unit: "-" }
      #   Bit0: communication status (1=Busy, 0=Idle)
      #   Bit3-1: uplink content (0=None,1=Imaging fw,2=FPN,3=Image motion,4=FPGA,5=Map)
      #   Bit7-4: status feedback (0=No error,1=Signalling,2=Seq num,3=Pkt checksum,
      #           4=Data checksum,5=Flash write timeout,6=Flash readback,7=Illegal op)

      # W27 - Uplink state of the main control module
      - { name: main_ctrl_uplink_state, offset: 26, length: 1, type: u8, unit: "-" }
      #   Bit1-0: FPGA switching status (00=Idle,01=Updating,10=Update failed)
      #   Bit4-2: uplink status feedback (0=Correct,1=Seq num,2=Checksum,3=Storage,
      #           4=Internal comm,5=FPGA error)
      #   Bit7-5: unused (0)

      # W28 - Uplink state of the imaging module
      - { name: imaging_uplink_state, offset: 27, length: 1, type: u8, unit: "-" }
      #   Bit0: data transmission status (1=Transmitting, 0=Stopped)
      #   Bit2-1: transmission content (00=None,01=Imaging program,10=FPN)
      #   Bit3: module channel selection (0=Module 1, 1=Module 2)
      #   Bit7-4: status feedback (0=No error,1=Comm checksum,2=Cam flash write,
      #           3=Cam flash config,4=Cam exec,5=Cam status timeout,
      #           6=Main ctrl storage,7=Main ctrl program exec)

      # W29 - Uplink packet counter
      - { name: uplink_packet_counter, offset: 28, length: 1, type: u8, unit: "-" }

      # W30-W31 - Packet sequence number of the internal imaging uplink error
      - { name: imaging_uplink_error_pkt_seq, offset: 29, length: 2, type: u16, unit: "-" }

      # W32 - Temperature setting value of channel 1 (secondary mirror heating zone)
      - { name: temp_set_ch1_secondary_mirror_raw, offset: 31, length: 1, type: u8, unit: "-" }
      - { name: temp_set_ch1_secondary_mirror, offset: 31, length: 1, type: u8, unit: "degC", calc_from: temp_set_ch1_secondary_mirror_raw, calc: "TEMP_SETPOINT" }
      #   Bit7: primary/backup acquisition channel (0=Primary, 1=Backup)
      #   Bit6: channel temperature abnormality (0=No, 1=Present)
      #   Bit5-0: temperature setting (current temp = setting/2)

      # W33 - Temperature setting value of channel 2 (support beam heating zone)
      - { name: temp_set_ch2_support_beam_raw, offset: 32, length: 1, type: u8, unit: "-" }
      - { name: temp_set_ch2_support_beam, offset: 32, length: 1, type: u8, unit: "degC", calc_from: temp_set_ch2_support_beam_raw, calc: "TEMP_SETPOINT" }

      # W34 - Temperature setting value of channel 3 (barrel heating zone 1)
      - { name: temp_set_ch3_barrel1_raw, offset: 33, length: 1, type: u8, unit: "-" }
      - { name: temp_set_ch3_barrel1, offset: 33, length: 1, type: u8, unit: "degC", calc_from: temp_set_ch3_barrel1_raw, calc: "TEMP_SETPOINT" }

      # W35 - Temperature setting value of channel 4 (barrel heating zone 2)
      - { name: temp_set_ch4_barrel2_raw, offset: 34, length: 1, type: u8, unit: "-" }
      - { name: temp_set_ch4_barrel2, offset: 34, length: 1, type: u8, unit: "degC", calc_from: temp_set_ch4_barrel2_raw, calc: "TEMP_SETPOINT" }

      # W36 - Temperature setting value of channel 5 (primary mirror heating zone)
      - { name: temp_set_ch5_primary_mirror_raw, offset: 35, length: 1, type: u8, unit: "-" }
      - { name: temp_set_ch5_primary_mirror, offset: 35, length: 1, type: u8, unit: "degC", calc_from: temp_set_ch5_primary_mirror_raw, calc: "TEMP_SETPOINT" }

      # W37 - Temperature setting value of channel 6 (focal plane heating zone)
      - { name: temp_set_ch6_focal_plane_raw, offset: 36, length: 1, type: u8, unit: "-" }
      - { name: temp_set_ch6_focal_plane, offset: 36, length: 1, type: u8, unit: "degC", calc_from: temp_set_ch6_focal_plane_raw, calc: "TEMP_SETPOINT" }

      # W38 - Temperature setting value of channel 7 (CMOS heating zone)
      - { name: temp_set_ch7_cmos_raw, offset: 37, length: 1, type: u8, unit: "-" }
      - { name: temp_set_ch7_cmos, offset: 37, length: 1, type: u8, unit: "degC", calc_from: temp_set_ch7_cmos_raw, calc: "TEMP_SETPOINT" }

      # W39 - Temperature setting value of channel 8
      - { name: temp_set_ch8_raw, offset: 38, length: 1, type: u8, unit: "-" }
      - { name: temp_set_ch8, offset: 38, length: 1, type: u8, unit: "degC", calc_from: temp_set_ch8_raw, calc: "TEMP_SETPOINT" }

      # W40 - Temperature setting value of channel 9
      - { name: temp_set_ch9_raw, offset: 39, length: 1, type: u8, unit: "-" }
      - { name: temp_set_ch9, offset: 39, length: 1, type: u8, unit: "degC", calc_from: temp_set_ch9_raw, calc: "TEMP_SETPOINT" }

      # W41 - Temperature setting value of channel 10
      - { name: temp_set_ch10_raw, offset: 40, length: 1, type: u8, unit: "-" }
      - { name: temp_set_ch10, offset: 40, length: 1, type: u8, unit: "degC", calc_from: temp_set_ch10_raw, calc: "TEMP_SETPOINT" }

      # W42 - Temperature setting value of channel 11
      - { name: temp_set_ch11_raw, offset: 41, length: 1, type: u8, unit: "-" }
      - { name: temp_set_ch11, offset: 41, length: 1, type: u8, unit: "degC", calc_from: temp_set_ch11_raw, calc: "TEMP_SETPOINT" }

      # W43 - Temperature setting value of channel 12
      - { name: temp_set_ch12_raw, offset: 42, length: 1, type: u8, unit: "-" }
      - { name: temp_set_ch12, offset: 42, length: 1, type: u8, unit: "degC", calc_from: temp_set_ch12_raw, calc: "TEMP_SETPOINT" }

      # W44 - Channel temperature threshold setting value (threshold = read/0.1)
      - { name: temp_threshold_setting, offset: 43, length: 1, type: u8, unit: "-" }

      # W45 - Max closed-loop heating power percentage of channel 1
      - { name: max_heat_power_pct_ch1, offset: 44, length: 1, type: u8, unit: "%" }

      # W46 - Max closed-loop heating power percentage of channel 2
      - { name: max_heat_power_pct_ch2, offset: 45, length: 1, type: u8, unit: "%" }

      # W47 - Max closed-loop heating power percentage of channel 3
      - { name: max_heat_power_pct_ch3, offset: 46, length: 1, type: u8, unit: "%" }

      # W48 - Max closed-loop heating power percentage of channel 4
      - { name: max_heat_power_pct_ch4, offset: 47, length: 1, type: u8, unit: "%" }

      # W49 - Max closed-loop heating power percentage of channel 5
      - { name: max_heat_power_pct_ch5, offset: 48, length: 1, type: u8, unit: "%" }

      # W50 - Max closed-loop heating power percentage of channel 6
      - { name: max_heat_power_pct_ch6, offset: 49, length: 1, type: u8, unit: "%" }

      # W51 - Max closed-loop heating power percentage of channel 7
      - { name: max_heat_power_pct_ch7, offset: 50, length: 1, type: u8, unit: "%" }

      # W52 - Max closed-loop heating power percentage of channel 8
      - { name: max_heat_power_pct_ch8, offset: 51, length: 1, type: u8, unit: "%" }

      # W53 - Max closed-loop heating power percentage of channel 9
      - { name: max_heat_power_pct_ch9, offset: 52, length: 1, type: u8, unit: "%" }

      # W54 - Max closed-loop heating power percentage of channel 10
      - { name: max_heat_power_pct_ch10, offset: 53, length: 1, type: u8, unit: "%" }

      # W55 - Max closed-loop heating power percentage of channel 11
      - { name: max_heat_power_pct_ch11, offset: 54, length: 1, type: u8, unit: "%" }

      # W56 - Max closed-loop heating power percentage of channel 12
      - { name: max_heat_power_pct_ch12, offset: 55, length: 1, type: u8, unit: "%" }

      # W57 - Channel heating abnormality status counter 1
      - { name: heating_abnormal_counter_1, offset: 56, length: 1, type: u8, unit: "-" }
      #   Bit7-4: ch2 heater patch error counter (support beam)
      #   Bit3-0: ch1 heater patch error counter (secondary mirror)

      # W58 - Channel heating abnormality status counter 2
      - { name: heating_abnormal_counter_2, offset: 57, length: 1, type: u8, unit: "-" }
      #   Bit7-4: ch4 heater patch error counter (barrel zone 2)
      #   Bit3-0: ch3 heater patch error counter (barrel zone 1)

      # W59 - Channel heating abnormality status counter 3
      - { name: heating_abnormal_counter_3, offset: 58, length: 1, type: u8, unit: "-" }
      #   Bit7-4: ch6 heater patch error counter (focal plane)
      #   Bit3-0: ch5 heater patch error counter (primary mirror)

      # W60 - Channel heating abnormality status counter 4
      - { name: heating_abnormal_counter_4, offset: 59, length: 1, type: u8, unit: "-" }
      #   Bit7-4: grating scale count abnormality counter
      #   Bit3-0: ch7 heater patch error counter (CMOS)

      # W61 - Channel heating abnormality status counter 5
      - { name: heating_abnormal_counter_5, offset: 60, length: 1, type: u8, unit: "-" }
      #   Bit7-4: ch9 heater patch error counter
      #   Bit3-0: ch8 heater patch error counter

      # W62 - Channel heating abnormality status counter 6
      - { name: heating_abnormal_counter_6, offset: 61, length: 1, type: u8, unit: "-" }
      #   Bit7-4: ch11 heater patch error counter
      #   Bit3-0: ch10 heater patch error counter

      # W63 - Channel heating abnormality status counter 7
      - { name: heating_abnormal_counter_7, offset: 62, length: 1, type: u8, unit: "-" }
      #   Bit7-4: reserved (0)
      #   Bit3-0: ch12 heater patch error counter

      # W64 - Focusing assembly status
      - { name: focusing_assembly_status, offset: 63, length: 1, type: u8, unit: "-" }
      #   Bit0: encoder upper limit +2 mm (0=Not reached,1=Reached)
      #   Bit1: encoder lower limit -2 mm (0=Not reached,1=Reached)
      #   Bit2: forward Hall trigger (0=Not triggered,1=Triggered)
      #   Bit3: negative Hall trigger (0=Not triggered,1=Triggered)
      #   Bit4: limit switch (0=Enabled,1=Disabled)
      #   Bit5: focusing mode (0=Closed-loop,1=Open-loop)
      #   Bit6: motion status (0=Stopped,1=Working)
      #   Bit7: motion direction (0=Forward,1=Reverse)

      # W65-W67 - Target grating scale value for closed-loop target position (u24)
      - { name: target_grating_scale_value, offset: 64, length: 3, type: u24, unit: "-" }
      #   Original code value = W65<<16 + W66<<8 + W67; default 80000

      # W68 - Reserved
      - { name: reserved_w68, offset: 67, length: 1, type: u8, unit: "-" }  # fill 0x55

      # W69-W71 - Current grating scale reading (u24)
      - { name: current_grating_scale_reading, offset: 68, length: 3, type: u24, unit: "-" }
      - { name: current_grating_position_nm, offset: 68, length: 3, type: u24, unit: "nm", calc_from: current_grating_scale_reading, calc: "GRATING_POSITION_NM" }
      #   Code value = W69<<16 + W70<<8 + W71; current position = code*20 nm

      # W72 - Visible-light module power status
      - { name: visible_light_module_power_status, offset: 71, length: 1, type: u8, unit: "-" }
      #   Bit0: imaging module main power (0=off,1=on)
      #   Bit1: imaging module 1 comm channel select (0=Primary,1=Backup)
      #   Bit2: imaging module 1 comm channel control (0=Manual,1=Automatic)
      #   Bit3: imaging module 2 comm channel select (0=Primary,1=Backup)
      #   Bit4: imaging module 2 comm channel control (0=Manual,1=Automatic)
      #   Bit7-5: unused (0)

      # W73 - Serial number of imaging module 1
      - { name: imaging_module1_serial_number, offset: 72, length: 1, type: u8, unit: "-" }

      # W74 - Status of imaging module 1
      - { name: imaging_module1_status, offset: 73, length: 1, type: u8, unit: "-" }
      #   Bit1-0: CMOS power-on status (00=off,01=turning,10=on)
      #   Bit2: imaging status (1=Working,0=Stopped)
      #   Bit3: PPS primary/backup (0=Primary,1=Backup)
      #   Bit4: FPN correction (0=Off,1=On)
      #   Bit5: detector push-broom direction (0=Forward,1=Reverse)
      #   Bit6: serial port comm primary/backup (0=Primary,1=Backup)
      #   Bit7: time sync selection (0=Platform,1=Autonomous)

      # W75-W77 - Program version number of imaging module 1 (u24)
      - { name: imaging_module1_program_version, offset: 74, length: 3, type: u24, unit: "-" }
      #   Version = W75<<16 + W76<<8 + W77 (YYMMDD, e.g. 251231)

      # W78 - Spectral integration stage setting 1 of imaging module 1
      - { name: imaging_module1_spectral_stage_1, offset: 77, length: 1, type: u8, unit: "-" }
      #   Bit7-4: imaging mode (5H=Linear array)
      #   Bit3-0: monochromatic P band (1~4, default 4)

      # W79 - Spectral integration stage setting 2 of imaging module 1
      - { name: imaging_module1_spectral_stage_2, offset: 78, length: 1, type: u8, unit: "-" }
      #   Bit7-4: panchromatic B2 band (1~4, default 4)
      #   Bit3-0: panchromatic B1 band (1~12, default 12)  [note: ICD text repeats "Bit4 to Bit7" — treating low nibble as B1]

      # W80 - Spectral integration stage setting 3 of imaging module 1
      - { name: imaging_module1_spectral_stage_3, offset: 79, length: 1, type: u8, unit: "-" }
      #   Bit7-4: monochromatic B3 band (1~8, default 8)
      #   Bit3-0: monochromatic B4 band (1~10, default 10)

      # W81 - Gain of imaging module 1
      - { name: imaging_module1_gain, offset: 80, length: 1, type: u8, unit: "-" }
      #   0x00=0.75x, 0x01=1x, 0x20=1.25x; default 0x01

      # W82-W84 - TDI frame period of imaging module 1 (u24)
      - { name: imaging_module1_tdi_frame_period_raw, offset: 81, length: 3, type: u24, unit: "-" }
      - { name: imaging_module1_tdi_frame_period, offset: 81, length: 3, type: u24, unit: "ns", calc_from: imaging_module1_tdi_frame_period_raw, calc: "TDI_FRAME_PERIOD_NS" }
      #   X = W82<<16 + W83<<8 + W84; frame period = X*100 ns

      # W85-W87 - CMOS exposure time of imaging module 1 (u24)
      - { name: imaging_module1_cmos_exposure_time_raw, offset: 84, length: 3, type: u24, unit: "-" }
      - { name: imaging_module1_cmos_exposure_time, offset: 84, length: 3, type: u24, unit: "us", calc_from: imaging_module1_cmos_exposure_time_raw, calc: "CMOS_EXPOSURE_US" }
      #   X = W85<<16 + W86<<8 + W87; exposure = 20us + X*2

      # W88-W89 - P-band window position of imaging module 1 (linear array mode)
      - { name: imaging_module1_p_band_window_pos, offset: 87, length: 2, type: u16, unit: "-" }
      #   Window position = W88<<8 + W89; range 4~7023; default 03E8H

      # W90 - Number of P-band window rows of imaging module 1
      - { name: imaging_module1_p_band_window_rows, offset: 89, length: 1, type: u8, unit: "rows" }
      #   0~255; default 12

      # W91-W92 - B1-band window position of imaging module 1
      - { name: imaging_module1_b1_band_window_pos, offset: 90, length: 2, type: u16, unit: "-" }
      #   Window position = W91<<8 + W92; range 4~7023; default 07D0H

      # W93 - Number of B1-band window rows of imaging module 1
      - { name: imaging_module1_b1_band_window_rows, offset: 92, length: 1, type: u8, unit: "rows" }
      #   0~255; default 4

      # W94-W95 - B2-band window position of imaging module 1
      - { name: imaging_module1_b2_band_window_pos, offset: 93, length: 2, type: u16, unit: "-" }
      #   Window position = W94<<8 + W95; range 4~7023; default 0BB8H

      # W96 - Number of B2-band window rows of imaging module 1
      - { name: imaging_module1_b2_band_window_rows, offset: 95, length: 1, type: u8, unit: "rows" }
      #   0~255; default 4

      # W97-W98 - B3-band window position of imaging module 1
      - { name: imaging_module1_b3_band_window_pos, offset: 96, length: 2, type: u16, unit: "-" }
      #   Window position = W97<<8 + W98; range 4~7023; default 0FA0H

      # W99 - Number of B3-band window rows of imaging module 1
      - { name: imaging_module1_b3_band_window_rows, offset: 98, length: 1, type: u8, unit: "rows" }
      #   0~255; default 8

      # W100-W101 - B4-band window position of imaging module 1
      - { name: imaging_module1_b4_band_window_pos, offset: 99, length: 2, type: u16, unit: "-" }
      #   Window position = W100<<8 + W101; range 4~7023; default 1388H

      # W102 - Number of B4-band window rows of imaging module 1
      - { name: imaging_module1_b4_band_window_rows, offset: 101, length: 1, type: u8, unit: "rows" }
      #   0~255; default 10

      # W103-W104 - Number of firmware re-upload packets of imaging module 1
      - { name: imaging_module1_fw_reupload_pkt_count, offset: 102, length: 2, type: u16, unit: "-" }
      #   = W103<<8 + W104; cyclic 0~65536

      # W105-W106 - Number of FPN re-upload packets of imaging module 1
      - { name: imaging_module1_fpn_reupload_pkt_count, offset: 104, length: 2, type: u16, unit: "-" }
      #   = W105<<8 + W106; cyclic 0~65536

      # W107-W110 - Reserved
      - { name: reserved_w107_w110, offset: 106, length: 4, type: u32, unit: "-" }  # fill 0x55

      # W111 - Serial number of imaging module 2
      - { name: imaging_module2_serial_number, offset: 110, length: 1, type: u8, unit: "-" }

      # W112 - Status of imaging module 2
      - { name: imaging_module2_status, offset: 111, length: 1, type: u8, unit: "-" }
      #   Bit1-0: CMOS power-on status (00=off,01=turning,10=on)
      #   Bit2: imaging status (1=Working,0=Stopped)
      #   Bit3: PPS primary/backup (0=Primary,1=Backup)
      #   Bit4: FPN correction (0=Off,1=On)
      #   Bit5: detector push-broom direction (0=Forward,1=Reverse)
      #   Bit6: serial port comm primary/backup (0=Primary,1=Backup)
      #   Bit7: time sync selection (0=Platform,1=Autonomous)

      # W113-W115 - Program version number of imaging module 2 (u24)
      - { name: imaging_module2_program_version, offset: 112, length: 3, type: u24, unit: "-" }
      #   Version = W113<<16 + W114<<8 + W115 (YYMMDD)

      # W116 - Spectral integration stage setting 1 of imaging module 2
      - { name: imaging_module2_spectral_stage_1, offset: 115, length: 1, type: u8, unit: "-" }
      #   Bit7-4: imaging mode (5H=Linear array)
      #   Bit3-0: monochromatic P band (1~4, default 4)

      # W117 - Spectral integration stage setting 2 of imaging module 2
      - { name: imaging_module2_spectral_stage_2, offset: 116, length: 1, type: u8, unit: "-" }
      #   Bit7-4: panchromatic B2 band (1~4, default 4)
      #   Bit3-0: panchromatic B1 band (1~12, default 12)

      # W118 - Spectral integration stage setting 3 of imaging module 2
      - { name: imaging_module2_spectral_stage_3, offset: 117, length: 1, type: u8, unit: "-" }
      #   Bit7-4: monochromatic B3 band (1~8, default 8)
      #   Bit3-0: monochromatic B4 band (1~10, default 10)

      # W119 - Gain of imaging module 2
      - { name: imaging_module2_gain, offset: 118, length: 1, type: u8, unit: "-" }
      #   0x00=0.75x, 0x01=1x, 0x20=1.25x; default 0x01

      # W120-W122 - TDI frame period of imaging module 2 (u24)
      - { name: imaging_module2_tdi_frame_period_raw, offset: 119, length: 3, type: u24, unit: "-" }
      - { name: imaging_module2_tdi_frame_period, offset: 119, length: 3, type: u24, unit: "ns", calc_from: imaging_module2_tdi_frame_period_raw, calc: "TDI_FRAME_PERIOD_NS" }
      #   X = W120<<16 + W121<<8 + W122; frame period = X*100 ns

      # W123-W125 - CMOS exposure time of imaging module 2 (u24)
      - { name: imaging_module2_cmos_exposure_time_raw, offset: 122, length: 3, type: u24, unit: "-" }
      - { name: imaging_module2_cmos_exposure_time, offset: 122, length: 3, type: u24, unit: "us", calc_from: imaging_module2_cmos_exposure_time_raw, calc: "CMOS_EXPOSURE_US" }
      #   X = W123<<16 + W124<<8 + W125; exposure = 20us + X*2

      # W126-W127 - P-band window position of imaging module 2
      - { name: imaging_module2_p_band_window_pos, offset: 125, length: 2, type: u16, unit: "-" }
      #   = W126<<8 + W127; range 4~7023; default 03E8H

      # W128 - Number of P-band window rows of imaging module 2
      - { name: imaging_module2_p_band_window_rows, offset: 127, length: 1, type: u8, unit: "rows" }
      #   0~255; default 12

      # W129-W130 - B1-band window position of imaging module 2
      - { name: imaging_module2_b1_band_window_pos, offset: 128, length: 2, type: u16, unit: "-" }
      #   = W129<<8 + W130; range 4~7023; default 07D0H

      # W131 - Number of B1-band window rows of imaging module 2
      - { name: imaging_module2_b1_band_window_rows, offset: 130, length: 1, type: u8, unit: "rows" }
      #   0~255; default 4

      # W132-W133 - B2-band window position of imaging module 2
      - { name: imaging_module2_b2_band_window_pos, offset: 131, length: 2, type: u16, unit: "-" }
      #   = W132<<8 + W133; range 4~7023; default 0BB8H

      # W134 - Number of B2-band window rows of imaging module 2
      - { name: imaging_module2_b2_band_window_rows, offset: 133, length: 1, type: u8, unit: "rows" }
      #   0~255; default 4

      # W135-W136 - B3-band window position of imaging module 2
      - { name: imaging_module2_b3_band_window_pos, offset: 134, length: 2, type: u16, unit: "-" }
      #   = W135<<8 + W136; range 4~7023; default 0FA0H

      # W137 - Number of B3-band window rows of imaging module 2
      - { name: imaging_module2_b3_band_window_rows, offset: 136, length: 1, type: u8, unit: "rows" }
      #   0~255; default 8

      # W138-W139 - B4-band window position of imaging module 2
      - { name: imaging_module2_b4_band_window_pos, offset: 137, length: 2, type: u16, unit: "-" }
      #   = W138<<8 + W139; range 4~7023; default 1388H

      # W140 - Number of B4-band window rows of imaging module 2
      - { name: imaging_module2_b4_band_window_rows, offset: 139, length: 1, type: u8, unit: "rows" }
      #   0~255; default 10

      # W141-W142 - Number of firmware re-upload packets of imaging module 2
      - { name: imaging_module2_fw_reupload_pkt_count, offset: 140, length: 2, type: u16, unit: "-" }
      #   = W141<<8 + W142; cyclic 0~65535

      # W143-W144 - Number of FPN re-upload packets of imaging module 2
      - { name: imaging_module2_fpn_reupload_pkt_count, offset: 142, length: 2, type: u16, unit: "-" }
      #   = W143<<8 + W144; cyclic 0~65535

      # Checksum (lower 8 bits of whole-packet checksum, excl. frame header/trailer)
      - { name: checksum, offset: 144, length: 1, type: u8, unit: "-" }

      # Frame trailer (0x2A)
      - { name: frame_trailer, offset: 145, length: 1, type: u8, unit: "-" }