unit:
  id: 0x2A
  label: "CDPM_R_AI"

cards:
  CDPM_R_AI_OTA:
    label: "CDPM_R (AI) OTA Missing"
    unit_id: 0x2A
    unit_sub_id: 0x02
    service: 0x82
    subservice: 0x0D
    subsystem: CDPM_R
    hw_class: SW
    fields:
      - { name: layout_tag,    offset: 0, length: 1, type: u8,  unit: "-" }
      - { name: missing_count, offset: 1, length: 1, type: u8,  unit: cnt }
      - { name: has_more,      offset: 2, length: 1, type: u8,  unit: "-" }

      # First 4 missing IDs (2 B each, BE)
      - { name: missing_0,     offset: 3,  length: 2, type: u16, unit: "-" }
      - { name: missing_1,     offset: 5,  length: 2, type: u16, unit: "-" }
      - { name: missing_2,     offset: 7,  length: 2, type: u16, unit: "-" }
      - { name: missing_3,     offset: 9,  length: 2, type: u16, unit: "-" }
      # Up to 117 IDs (offset 3 + 2*N). Rest is 0xFF padding.