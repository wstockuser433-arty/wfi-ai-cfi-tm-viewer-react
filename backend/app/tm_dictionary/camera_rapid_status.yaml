# ============================================================
# EBOX TM Dictionary — RS-422 ICD
# ============================================================
# Key: 4-tuple (unit_id, unit_sub_id, service, subservice)
#
# Unit IDs:
#   0x1A — EBOX (Camera Unit / Packet #12)
#   0x2A — CTPU / CDPM_R (AI) / CDPM_R (FPGA)
#
# Service types:
#   0x64 — Telemetry Poll (TC-path)
#   0x65 — Telecommand (TC-path)
#   0x66 — Telemetry response
#   0x67 — Data Block (TC-path)
#   0x68 — ACK response / TM data (§5.2 – §5.8)
#   0x6A — GNC broadcast (§6.2)
#
# Sub-services under 0x68:
#   0x01 Camera Unit Status          (§5.3, Table 49)  ← main one
#   0x02 Image Motion Calculation    (§5.4)
#   0x03 Image Motion Coefficient    (§5.5)
#   0x04 Terrain Elevation           (§5.6)
#   0x05 Uplink Result 1             (§5.7)
#   0x06 Uplink Result 2             (§5.8)
# ============================================================

unit:
  id: 0x1A
  label: "CAMERA"

# ─────────────────────────────────────────────────────────────
# Calc helpers
#
# Every field with `calc_from:` means: take the raw uN value D
# from `calc_from`, apply the `calc` helper, and store the
# result in this field's `value`.
#
# Named helpers live in ebox_calcs.py so we don't eval anything.
# ─────────────────────────────────────────────────────────────

cards:

  # ══════════════════════════════════════════════════════════════
  # §5.3 Rapid Change Camera Status Telemetry — (Packet #12)
  # EBOX (0x1A / 0x10) → CTPU
  # Service 0x68 / Sub-Service 0x01
  # ══════════════════════════════════════════════════════════════
  CAMERA_RAPID_STATUS:
    label: "Rapid Change Camera Status"
    unit_id: 0x1A
    unit_sub_id: 0x10
    service: 0x68
    subservice: 0x01
    subsystem: CAMERA
    hw_class: HW
    fields:
      # ── Command counters (W1–W9, 1 B each) ────────────────────
      - { name: cmd_rx_count,               offset: 0,  type: u8, unit: "cnt" }
      - { name: cmd_cksum_err_count,        offset: 1,  type: u8, unit: "cnt" }
      - { name: cmd_param_err_count,        offset: 2,  type: u8, unit: "cnt" }
      - { name: cmd_illegal_err_count,      offset: 3,  type: u8, unit: "cnt" }
      - { name: payload_status_req_count,   offset: 4,  type: u8, unit: "cnt" }
      - { name: img_motion_req_count,       offset: 5,  type: u8, unit: "cnt" }
      - { name: img_motion_param_req_count, offset: 6,  type: u8, unit: "cnt" }
      - { name: terrain_elev_req_count,     offset: 7,  type: u8, unit: "cnt" }
      - { name: uplink_state_req_count,     offset: 8,  type: u8, unit: "cnt" }

      # ── Broadcast counters (W10–W11) ──────────────────────────
      - { name: sat_time_broadcast_rx_count, offset: 9,  type: u8, unit: "cnt" }
      - { name: gnc_broadcast_rx_count,      offset: 10, type: u8, unit: "cnt" }

      # ── Temperatures & currents (W12–W21) ─────────────────────
      - { name: power_conv_chip_temp_raw, offset: 11, type: u16, unit: "-" }
      - { name: power_conv_chip_temp_c,   offset: 11, type: u16, unit: "°C",
          calc_from: power_conv_chip_temp_raw, calc: "TEMP_CHIP" }        # ICD: T = 326.85 - D/4095*2500

      - { name: mcu_primary_current_raw,  offset: 13, type: u16, unit: "-" }
      - { name: mcu_primary_current_a,    offset: 13, type: u16, unit: "A",
          calc_from: mcu_primary_current_raw, calc: "CURRENT_2V5_SCALE" } # ICD: D=(W<<8+W)/4095*5; I=2.5*(D-2.445)

      - { name: mcu_backup_current_raw,   offset: 15, type: u16, unit: "-" }
      - { name: mcu_backup_current_a,     offset: 15, type: u16, unit: "A",
          calc_from: mcu_backup_current_raw, calc: "CURRENT_2V5_SCALE" }

      - { name: imaging_module_current_raw, offset: 17, type: u16, unit: "-" }
      - { name: imaging_module_current_a,   offset: 17, type: u16, unit: "A",
          calc_from: imaging_module_current_raw, calc: "CURRENT_2V5_SCALE" }

      - { name: ai_module_current_raw,    offset: 19, type: u16, unit: "-" }
      - { name: ai_module_current_a,      offset: 19, type: u16, unit: "A",
          calc_from: ai_module_current_raw, calc: "CURRENT_2V5_SCALE" }

      # ── LTM8051 temperature (W22–W23, bit-dependent) ──────────
      - { name: ltm8051_temp_raw, offset: 21, type: u16, unit: "-" }
      - { name: ltm8051_temp_c,   offset: 21, type: u16, unit: "°C",
          calc_from: ltm8051_temp_raw, calc: "TEMP_LTM8051" }             # special: sign-extends on D & 0x800

      # ── FPGA / DDR / SoC temperatures (W24–W27) ───────────────
      - { name: ddr_memory_temp_raw, offset: 23, type: u16, unit: "-" }
      - { name: ddr_memory_temp_c,   offset: 23, type: u16, unit: "°C",
          calc_from: ddr_memory_temp_raw, calc: "TEMP_DDR" }              # TBD: verify with EBOX team

      - { name: m2s090_temp_raw, offset: 25, type: u16, unit: "-" }
      - { name: m2s090_temp_c,   offset: 25, type: u16, unit: "°C",
          calc_from: m2s090_temp_raw, calc: "TEMP_M2S090" }              # TBD: verify with EBOX team

      # ── Primary thermistors ch1–ch12 (W28–W51, 12 × u16) ─────
      # NTC formula: R = 10*(256*D)/(4095-256*D)
      #   T = 1/((1/298.15)+ln(R/10)/4100) - 273.15
      - { name: ntc_primary_ch1_raw,  offset: 27, type: u16, unit: "-" }
      - { name: ntc_primary_ch1_c,    offset: 27, type: u16, unit: "°C",
          calc_from: ntc_primary_ch1_raw, calc: "TEMP_NTC" }
      - { name: ntc_primary_ch2_raw,  offset: 29, type: u16, unit: "-" }
      - { name: ntc_primary_ch2_c,    offset: 29, type: u16, unit: "°C",
          calc_from: ntc_primary_ch2_raw, calc: "TEMP_NTC" }
      - { name: ntc_primary_ch3_raw,  offset: 31, type: u16, unit: "-" }
      - { name: ntc_primary_ch3_c,    offset: 31, type: u16, unit: "°C",
          calc_from: ntc_primary_ch3_raw, calc: "TEMP_NTC" }
      - { name: ntc_primary_ch4_raw,  offset: 33, type: u16, unit: "-" }
      - { name: ntc_primary_ch4_c,    offset: 33, type: u16, unit: "°C",
          calc_from: ntc_primary_ch4_raw, calc: "TEMP_NTC" }
      - { name: ntc_primary_ch5_raw,  offset: 35, type: u16, unit: "-" }
      - { name: ntc_primary_ch5_c,    offset: 35, type: u16, unit: "°C",
          calc_from: ntc_primary_ch5_raw, calc: "TEMP_NTC" }
      - { name: ntc_primary_ch6_raw,  offset: 37, type: u16, unit: "-" }
      - { name: ntc_primary_ch6_c,    offset: 37, type: u16, unit: "°C",
          calc_from: ntc_primary_ch6_raw, calc: "TEMP_NTC" }
      - { name: ntc_primary_ch7_raw,  offset: 39, type: u16, unit: "-" }
      - { name: ntc_primary_ch7_c,    offset: 39, type: u16, unit: "°C",
          calc_from: ntc_primary_ch7_raw, calc: "TEMP_NTC" }
      - { name: ntc_primary_ch8_raw,  offset: 41, type: u16, unit: "-" }
      - { name: ntc_primary_ch8_c,    offset: 41, type: u16, unit: "°C",
          calc_from: ntc_primary_ch8_raw, calc: "TEMP_NTC" }
      - { name: ntc_primary_ch9_raw,  offset: 43, type: u16, unit: "-" }
      - { name: ntc_primary_ch9_c,    offset: 43, type: u16, unit: "°C",
          calc_from: ntc_primary_ch9_raw, calc: "TEMP_NTC" }
      - { name: ntc_primary_ch10_raw, offset: 45, type: u16, unit: "-" }
      - { name: ntc_primary_ch10_c,   offset: 45, type: u16, unit: "°C",
          calc_from: ntc_primary_ch10_raw, calc: "TEMP_NTC" }
      - { name: ntc_primary_ch11_raw, offset: 47, type: u16, unit: "-" }
      - { name: ntc_primary_ch11_c,   offset: 47, type: u16, unit: "°C",
          calc_from: ntc_primary_ch11_raw, calc: "TEMP_NTC" }
      - { name: ntc_primary_ch12_raw, offset: 49, type: u16, unit: "-" }
      - { name: ntc_primary_ch12_c,   offset: 49, type: u16, unit: "°C",
          calc_from: ntc_primary_ch12_raw, calc: "TEMP_NTC" }

      # ── Backup thermistors ch1–ch12 (W52–W75, 12 × u16) ──────
      - { name: ntc_backup_ch1_raw,   offset: 51, type: u16, unit: "-" }
      - { name: ntc_backup_ch1_c,     offset: 51, type: u16, unit: "°C",
          calc_from: ntc_backup_ch1_raw, calc: "TEMP_NTC" }
      - { name: ntc_backup_ch2_raw,   offset: 53, type: u16, unit: "-" }
      - { name: ntc_backup_ch2_c,     offset: 53, type: u16, unit: "°C",
          calc_from: ntc_backup_ch2_raw, calc: "TEMP_NTC" }
      - { name: ntc_backup_ch3_raw,   offset: 55, type: u16, unit: "-" }
      - { name: ntc_backup_ch3_c,     offset: 55, type: u16, unit: "°C",
          calc_from: ntc_backup_ch3_raw, calc: "TEMP_NTC" }
      - { name: ntc_backup_ch4_raw,   offset: 57, type: u16, unit: "-" }
      - { name: ntc_backup_ch4_c,     offset: 57, type: u16, unit: "°C",
          calc_from: ntc_backup_ch4_raw, calc: "TEMP_NTC" }
      - { name: ntc_backup_ch5_raw,   offset: 59, type: u16, unit: "-" }
      - { name: ntc_backup_ch5_c,     offset: 59, type: u16, unit: "°C",
          calc_from: ntc_backup_ch5_raw, calc: "TEMP_NTC" }
      - { name: ntc_backup_ch6_raw,   offset: 61, type: u16, unit: "-" }
      - { name: ntc_backup_ch6_c,     offset: 61, type: u16, unit: "°C",
          calc_from: ntc_backup_ch6_raw, calc: "TEMP_NTC" }
      - { name: ntc_backup_ch7_raw,   offset: 63, type: u16, unit: "-" }
      - { name: ntc_backup_ch7_c,     offset: 63, type: u16, unit: "°C",
          calc_from: ntc_backup_ch7_raw, calc: "TEMP_NTC" }
      - { name: ntc_backup_ch8_raw,   offset: 65, type: u16, unit: "-" }
      - { name: ntc_backup_ch8_c,     offset: 65, type: u16, unit: "°C",
          calc_from: ntc_backup_ch8_raw, calc: "TEMP_NTC" }
      - { name: ntc_backup_ch9_raw,   offset: 67, type: u16, unit: "-" }
      - { name: ntc_backup_ch9_c,     offset: 67, type: u16, unit: "°C",
          calc_from: ntc_backup_ch9_raw, calc: "TEMP_NTC" }
      - { name: ntc_backup_ch10_raw,  offset: 69, type: u16, unit: "-" }
      - { name: ntc_backup_ch10_c,    offset: 69, type: u16, unit: "°C",
          calc_from: ntc_backup_ch10_raw, calc: "TEMP_NTC" }
      - { name: ntc_backup_ch11_raw,  offset: 71, type: u16, unit: "-" }
      - { name: ntc_backup_ch11_c,    offset: 71, type: u16, unit: "°C",
          calc_from: ntc_backup_ch11_raw, calc: "TEMP_NTC" }
      - { name: ntc_backup_ch12_raw,  offset: 73, type: u16, unit: "-" }
      - { name: ntc_backup_ch12_c,    offset: 73, type: u16, unit: "°C",
          calc_from: ntc_backup_ch12_raw, calc: "TEMP_NTC" }

      # ── Primary heater patch status ch1–ch12 (W76–W87) ───────
      # Bit7 = control mode (0=closed-loop, 1=open-loop)
      # Bits 6..0 = PWM value
      - { name: prim_heater_ch1_status,  offset: 75, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: prim_heater_ch2_status,  offset: 76, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: prim_heater_ch3_status,  offset: 77, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: prim_heater_ch4_status,  offset: 78, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: prim_heater_ch5_status,  offset: 79, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: prim_heater_ch6_status,  offset: 80, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: prim_heater_ch7_status,  offset: 81, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: prim_heater_ch8_status,  offset: 82, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: prim_heater_ch9_status,  offset: 83, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: prim_heater_ch10_status, offset: 84, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: prim_heater_ch11_status, offset: 85, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: prim_heater_ch12_status, offset: 86, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }

      # ── Backup heater patch status ch1–ch12 (W88–W99) ────────
      - { name: backup_heater_ch1_status,  offset: 87, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: backup_heater_ch2_status,  offset: 88, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: backup_heater_ch3_status,  offset: 89, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: backup_heater_ch4_status,  offset: 90, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: backup_heater_ch5_status,  offset: 91, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: backup_heater_ch6_status,  offset: 92, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: backup_heater_ch7_status,  offset: 93, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: backup_heater_ch8_status,  offset: 94, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: backup_heater_ch9_status,  offset: 95, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: backup_heater_ch10_status, offset: 96, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: backup_heater_ch11_status, offset: 97, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }
      - { name: backup_heater_ch12_status, offset: 98, type: u8, unit: "-",
          bits: [{ name: mode, bit: 7 }, { name: pwm, low: 0, high: 6 }] }

      # ── Imaging module 1 command counter (W100) ──────────────
      - { name: img_mod1_cmd_rx_count, offset: 99, type: u8, unit: "cnt" }

      # ── Imaging module 1 counters (W101–W102) ────────────────
      - { name: img_mod1_cmd_err_count,  offset: 100, type: u8, unit: "cnt" }
      - { name: img_mod1_pps_miss_count, offset: 101, type: u8, unit: "cnt" }

      # ── Imaging module 1 temperatures (W103–W106) ────────────
      # Channel temp: R = W103<<8 + W104 (signed two's complement);
      #   module temperature = R/128  → 27 °C at room temperature
      - { name: img_mod1_channel_temp_raw, offset: 102, type: u16, unit: "-" }
      - { name: img_mod1_channel_temp_c,   offset: 102, type: u16, unit: "°C",
          calc_from: img_mod1_channel_temp_raw, calc: "TEMP_CHANNEL_1" }

      # FPGA temp: T = ((W105<<8 + W106)/16 * 503.975/4096) - 273.15
      - { name: img_mod1_fpga_temp_raw, offset: 104, type: u16, unit: "-" }
      - { name: img_mod1_fpga_temp_c,   offset: 104, type: u16, unit: "°C",
          calc_from: img_mod1_fpga_temp_raw, calc: "TEMP_FPGA_MODULE" }

      # ── Imaging module 1 GPS time (W107–W114) ────────────────
      - { name: img_mod1_gps_sec, offset: 106, type: u32, unit: "s" }    # W107–W110
      - { name: img_mod1_gps_ms,  offset: 110, type: u16, unit: "ms" }   # W111–W112
      - { name: img_mod1_gps_us,  offset: 112, type: u16, unit: "µs" }   # W113–W114

      # ── Imaging module 2 counters (W115–W117) ────────────────
      - { name: img_mod2_cmd_rx_count,   offset: 114, type: u8, unit: "cnt" }
      - { name: img_mod2_cmd_err_count,  offset: 115, type: u8, unit: "cnt" }
      - { name: img_mod2_pps_miss_count, offset: 116, type: u8, unit: "cnt" }

      # ── Imaging module 2 temperatures (W118–W121) ────────────
      - { name: img_mod2_channel_temp_raw, offset: 117, type: u16, unit: "-" }
      - { name: img_mod2_channel_temp_c,   offset: 117, type: u16, unit: "°C",
          calc_from: img_mod2_channel_temp_raw, calc: "TEMP_CHANNEL_1" }
      - { name: img_mod2_fpga_temp_raw,    offset: 119, type: u16, unit: "-" }
      - { name: img_mod2_fpga_temp_c,      offset: 119, type: u16, unit: "°C",
          calc_from: img_mod2_fpga_temp_raw, calc: "TEMP_FPGA_MODULE" }

      # ── Imaging module 2 GPS time (W122–W129) ────────────────
      - { name: img_mod2_gps_sec, offset: 121, type: u32, unit: "s" }    # W122–W125
      - { name: img_mod2_gps_ms,  offset: 125, type: u16, unit: "ms" }   # W126–W127
      - { name: img_mod2_gps_us,  offset: 127, type: u16, unit: "µs" }   # W128–W129

      # ── Main control unit power-on duration (W130–W131) ──────
      - { name: mcu_power_on_duration_h, offset: 129, type: u16, unit: "h" }