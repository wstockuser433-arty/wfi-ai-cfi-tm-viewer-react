version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tm
      POSTGRES_PASSWORD: tm
      POSTGRES_DB: tmdb
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql+asyncpg://tm:tm@postgres:5432/tmdb
      TM_LISTEN_HOST: 0.0.0.0
      TM_LISTEN_PORT: 9100
      ENABLE_SIM: "true"
    ports: ["8000:8000", "9100:9100"]
    depends_on: [postgres, redis]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE: http://backend:8000
    depends_on: [backend]

volumes:
  pgdata: